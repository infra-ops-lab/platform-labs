# Step 2: one shared Kafka cluster for the cell (KRaft, no ZooKeeper). Single node for the lab; production uses
# 3 controllers + N brokers across zones, RF=3, min.insync.replicas=2. Only an mTLS listener: every client has an
# identity (a KafkaUser cert), so ACLs and quotas apply per team/tenant. No anonymous access.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels: { strimzi.io/cluster: platform }
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - { id: 0, type: persistent-claim, size: 2Gi, deleteClaim: true, kraftMetadata: shared }
  resources:
    requests: { cpu: 200m, memory: 1Gi }
    limits: { memory: 1536Mi }
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: platform
  namespace: kafka
spec:
  kafka:
    version: 4.3.2
    listeners:
      - { name: tls, port: 9093, type: internal, tls: true, authentication: { type: tls } }
    authorization:
      type: simple
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false      # topics exist only if declared (topic-as-code)
  entityOperator:
    topicOperator: {}
    userOperator: {}

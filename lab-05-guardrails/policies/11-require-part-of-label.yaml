# Rule: every Pod must say which system it belongs to (ownership and cost reporting).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-part-of-label
  annotations:
    policies.kyverno.io/title: Require app.kubernetes.io/part-of
    policies.kyverno.io/description: Pods must carry the app.kubernetes.io/part-of label.
spec:
  background: true
  rules:
  - name: require-part-of
    match:
      any:
      - resources:
          kinds: [Pod]
    exclude:
      any:
      - resources:
          namespaces: [kube-system, kube-public, kube-node-lease, kyverno, argo-rollouts, local-path-storage]
    validate:
      failureAction: Audit
      message: "Pods must have the label app.kubernetes.io/part-of."
      pattern:
        metadata:
          labels:
            app.kubernetes.io/part-of: "?*"

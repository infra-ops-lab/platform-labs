apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: golden-service
  title: Golden path - HTTP microservice
  description: New service with Kubernetes manifests, probes, limits, TechDocs, and GitOps deploy via Argo CD.
  tags: [recommended, kubernetes, gitops]
spec:
  owner: group:platform
  type: service
  parameters:
    - title: Service details
      required: [name, description, owner]
      properties:
        name:
          title: Name
          type: string
          pattern: '^[a-z][a-z0-9-]{2,30}$'
          ui:help: Lowercase, digits and dashes. Becomes the repo and namespace name.
        description:
          title: Description
          type: string
          minLength: 5
          ui:help: One line about what the service does. Shown in the catalog and the repo.
        owner:
          title: Owner team
          type: string
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: [Group]
            catalogFilter: { kind: Group }
        tier:
          title: Tier
          type: string
          enum: [tier-1, tier-2, tier-3]
          default: tier-3
        replicas:
          title: Replicas
          type: integer
          default: 2
          minimum: 1
          maximum: 5
  steps:
    - id: fetch
      name: Render skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          tier: ${{ parameters.tier }}
          replicas: ${{ parameters.replicas }}
    - id: publish
      name: Create repo in Gitea
      action: publish:gitea
      input:
        repoUrl: localhost:3300?owner=golden&repo=${{ parameters.name }}
        # publish:gitea requires a description; fall back to a generated one if empty
        description: ${{ parameters.description or ('Golden-path service ' + parameters.name) }}
        defaultBranch: main
        repoVisibility: public
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        # publish:gitea's repoContentsUrl drops the branch name, so build the URL explicitly
        catalogInfoUrl: http://localhost:3300/golden/${{ parameters.name }}/src/branch/main/catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: Argo CD (all cells)
        url: http://localhost:8080/applications?labels=fleet.lab%2Fservice%3D${{ parameters.name }}

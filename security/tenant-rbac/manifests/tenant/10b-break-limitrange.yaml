# Step 10b: breaks LimitRange max (2 CPU limit, max is 1). PSA-compliant on purpose,
# so the ONLY problem is the limit. No namespace: apply as bob with -n acme-dev.
apiVersion: apps/v1
kind: Deployment
metadata: { name: big }
spec:
  replicas: 1
  selector: { matchLabels: { app: big } }
  template:
    metadata: { labels: { app: big } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
      - name: c
        image: busybox:1.37
        command: ["sleep", "3600"]
        resources:
          requests: { cpu: 500m, memory: 64Mi }
          limits:   { cpu: "2",  memory: 128Mi }
        securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }

# Step 9: tenant workload. No namespace on purpose: apply as bob with -n acme-dev or -n acme-prod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
      - name: web
        image: busybox:1.37
        command: ["sh", "-c", "echo hello-acme > /tmp/index.html && httpd -f -p 8080 -h /tmp"]
        ports: [{ containerPort: 8080 }]
        resources:
          requests: { cpu: 100m, memory: 64Mi }
          limits:   { cpu: 200m, memory: 128Mi }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports: [{ port: 8080, targetPort: 8080 }]

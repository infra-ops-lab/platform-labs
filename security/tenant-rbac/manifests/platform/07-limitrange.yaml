# Step 7: container defaults, min/max, ratio
apiVersion: v1
kind: LimitRange
metadata:
  name: acme-limits
  namespace: acme-dev
spec:
  limits:
  - type: Container
    defaultRequest: { cpu: 100m, memory: 64Mi }
    default:        { cpu: 200m, memory: 128Mi }
    min:            { cpu: 10m,  memory: 16Mi }
    max:            { cpu: "1",  memory: 512Mi }
    maxLimitRequestRatio: { cpu: "4" }
---
apiVersion: v1
kind: LimitRange
metadata:
  name: acme-limits
  namespace: acme-prod
spec:
  limits:
  - type: Container
    defaultRequest: { cpu: 100m, memory: 64Mi }
    default:        { cpu: 200m, memory: 128Mi }
    min:            { cpu: 10m,  memory: 16Mi }
    max:            { cpu: "1",  memory: 512Mi }
    maxLimitRequestRatio: { cpu: "4" }

# Step 4b: developers -> custom reusable ClusterRole, bound per namespace to a group
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-developer
  labels:
    platform.example.com/role: tenant
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["replicasets", "deployments/scale"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: [""]
  resources: ["events", "resourcequotas", "limitranges"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
# no secrets on purpose
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acme-devs
  namespace: acme-dev
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tenant-developer }
subjects:
- { apiGroup: rbac.authorization.k8s.io, kind: Group, name: acme-devs }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acme-devs
  namespace: acme-prod
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tenant-developer }
subjects:
- { apiGroup: rbac.authorization.k8s.io, kind: Group, name: acme-devs }

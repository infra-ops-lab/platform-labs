# Step 6: compute + object-count quota per namespace (dev smaller than prod)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: acme-quota
  namespace: acme-dev
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "10"
    services: "5"
    services.loadbalancers: "0"
    services.nodeports: "0"
    persistentvolumeclaims: "3"
    requests.storage: 5Gi
    count/secrets: "10"
    count/configmaps: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: acme-quota
  namespace: acme-prod
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
    services: "5"
    services.loadbalancers: "0"
    services.nodeports: "0"
    persistentvolumeclaims: "3"
    requests.storage: 5Gi
    count/secrets: "10"
    count/configmaps: "10"

# Step 2: tenant namespaces with tenant + Pod Security labels (platform team owns these)
apiVersion: v1
kind: Namespace
metadata:
  name: acme-dev
  labels:
    insights.pkbehera.co.in/tenant: acme          # tenant-insights groups namespaces by this
    platform.example.com/team: acme                # team label used by other platform tooling
    env: dev
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: acme-prod
  labels:
    insights.pkbehera.co.in/tenant: acme
    platform.example.com/team: acme
    env: prod
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

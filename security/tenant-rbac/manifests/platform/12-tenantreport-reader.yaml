# Step 12: acme admins may get/watch only the "acme" TenantReport (cluster-scoped -> ClusterRoleBinding)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenantreport-reader-acme
rules:
- apiGroups: ["insights.pkbehera.co.in"]
  resources: ["tenantreports"]
  resourceNames: ["acme"]
  verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenantreport-reader-acme
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: tenantreport-reader-acme }
subjects:
- { apiGroup: rbac.authorization.k8s.io, kind: Group, name: acme-admins }

# Step 4a: tenant admins -> built-in ClusterRole "admin", bound per namespace to a group
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acme-admins
  namespace: acme-dev
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects:
- { apiGroup: rbac.authorization.k8s.io, kind: Group, name: acme-admins }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acme-admins
  namespace: acme-prod
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects:
- { apiGroup: rbac.authorization.k8s.io, kind: Group, name: acme-admins }

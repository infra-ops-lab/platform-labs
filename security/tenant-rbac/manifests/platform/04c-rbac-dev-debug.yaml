# Step 4c: exec and port-forward only in dev (namespaced Role)
# In 1.31+ exec over websockets needs "create" on pods/exec.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-debug
  namespace: acme-dev
rules:
- apiGroups: [""]
  resources: ["pods/exec", "pods/portforward"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: acme-devs-debug
  namespace: acme-dev
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: dev-debug }
subjects:
- { apiGroup: rbac.authorization.k8s.io, kind: Group, name: acme-devs }

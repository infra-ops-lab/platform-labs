# Replaces deploy/kustomization.yaml in the golden/tenant-api repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  # Same identity labels as the golden-path template. Kustomize puts them on the Services
  # (and their selectors), but NOT on the Rollout's selector or pod template: Rollout is a
  # custom resource and Kustomize only knows the paths of built-in kinds. So rollout.yaml
  # writes them out by hand.
  - pairs:
      app.kubernetes.io/name: tenant-api
      app.kubernetes.io/instance: tenant-api
      app.kubernetes.io/part-of: golden-path
    includeSelectors: true
  - pairs:
      app.kubernetes.io/managed-by: argocd
      platform.golden/tier: tier-2
    includeSelectors: false
resources:
  - rollout.yaml
  - service.yaml
  - service-canary.yaml
  - analysis-template.yaml

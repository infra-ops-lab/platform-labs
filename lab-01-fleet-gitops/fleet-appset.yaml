# Lab 1: one ApplicationSet = every service (repo with deploy/) x every cell.
# Apply to the hub cluster:
#   kubectl --context hub apply -f lab-01-fleet-gitops/fleet-appset.yaml
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fleet-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      # Services: repos in the Gitea org "golden" that contain deploy/
      - scmProvider:
          requeueAfterSeconds: 30
          gitea:
            owner: golden
            api: http://gitea-http.gitea.svc:3000   # in-cluster address (Argo CD runs in the hub)
            insecure: true
            # Private repos: tokenRef: { secretName: gitea-token, key: token }
          filters:
          - pathsExist: [deploy]
      # Placement: every registered cluster that is a cell (the hub has no cell label)
      - clusters:
          selector:
            matchExpressions:
            - key: fleet.lab/cell
              operator: Exists
  template:
    metadata:
      name: '{{ .repository }}-{{ .name }}'
      labels:
        fleet.lab/service: '{{ .repository }}'
        fleet.lab/cell: '{{ .name }}'
        fleet.lab/ring: '{{ index .metadata.labels "fleet.lab/ring" }}'
    spec:
      project: default
      source:
        # Gitea reports a localhost clone URL, so build it from the in-cluster host
        repoURL: 'http://gitea-http.gitea.svc:3000/{{ .organization }}/{{ .repository }}.git'
        targetRevision: '{{ .branch }}'
        path: deploy
      destination:
        server: '{{ .server }}'
        namespace: '{{ .repository }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true

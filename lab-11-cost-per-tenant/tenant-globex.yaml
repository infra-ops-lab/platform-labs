# A second tenant on cell-1, plus some work that requests CPU, so there is cost to share out.
# Labelling the namespace is the whole onboarding (Lab 5 generates its NetworkPolicy, quota and limits).
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-globex
  labels:
    tenant.lab/id: globex
    team: team-payments
    cost-center: cc-200
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: tenant-globex
  labels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: globex }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: globex }
    spec:
      containers:
        - name: worker
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          resources:
            requests: { cpu: 200m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }

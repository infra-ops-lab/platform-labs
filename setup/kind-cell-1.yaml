kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cell-1
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6551
nodes:
  - role: control-plane
    image: kindest/node:v1.31.0
    labels:
      topology.lab/cell: cell-1
    extraPortMappings:
      - { containerPort: 30880, hostPort: 8881, listenAddress: "127.0.0.1" }  # apps in cell-1
